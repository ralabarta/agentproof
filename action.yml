name: AgentProof verification
description: Verify supplied coding-agent evidence without executing pull-request repository code
branding:
  icon: shield
  color: green
inputs:
  base:
    description: Git baseline, such as origin/main
    required: true
  test-results:
    description: Newline-separated repository-relative JUnit XML or Go test2json artifacts
    required: false
  require-tests:
    description: Fail when no valid test-result artifact is supplied
    required: false
    default: "false"
  fail-on:
    description: critical, high, medium, low, or none
    required: false
    default: critical
outputs:
  conclusion:
    description: passed, warning, or failed
    value: ${{ steps.verify.outputs.conclusion }}
  bundle-id:
    description: SHA-256 identity of the canonical evidence manifest
    value: ${{ steps.verify.outputs.bundle-id }}
  completeness:
    description: Required evidence completeness percentage
    value: ${{ steps.verify.outputs.completeness }}
  integrity:
    description: Canonical manifest integrity result
    value: ${{ steps.verify.outputs.integrity }}
  critical-violations:
    description: Number of critical deterministic findings
    value: ${{ steps.verify.outputs.critical-violations }}
  warnings:
    description: Number of non-critical deterministic findings
    value: ${{ steps.verify.outputs.warnings }}
  report:
    description: Repository-relative Markdown report path
    value: .agentproof/report.md
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.22.x"
        cache: false
    - name: Build pinned AgentProof source
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && go build -trimpath -o "$RUNNER_TEMP/agentproof" ./cmd/agentproof
    - name: Initialize local evidence directory
      shell: bash
      run: test -f .agentproof/config.json || "$RUNNER_TEMP/agentproof" init
    - name: Verify supplied evidence
      id: verify
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_TEST_RESULTS: ${{ inputs.test-results }}
        INPUT_REQUIRE_TESTS: ${{ inputs.require-tests }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(verify --base "$INPUT_BASE" --fail-on "$INPUT_FAIL_ON")
        if [ "$INPUT_REQUIRE_TESTS" = "true" ]; then args+=(--require-tests); fi
        while IFS= read -r result; do
          if [ -n "$result" ]; then args+=(--test-result "$result"); fi
        done <<< "$INPUT_TEST_RESULTS"
        set +e
        "$RUNNER_TEMP/agentproof" "${args[@]}"
        verify_code=$?
        set -e
        output_code=0
        set +e
        printf 'evidence-valid=false\n' >> "$GITHUB_OUTPUT"
        output_code=$?
        if [ "$output_code" -eq 0 ] && [ -f .agentproof/evidence.json ]; then
          jq -r '
            def safe_line_string:
              type == "string" and
              (contains("\r") | not) and
              (contains("\n") | not);
            def valid_status:
              safe_line_string and
              (. == "passed" or . == "warning" or . == "failed");
            def valid_integrity:
              safe_line_string and
              (. == "passed" or . == "failed" or . == "unknown" or . == "valid");
            def valid_findings:
              . == null or
              (type == "array" and all(.[]; type == "object" and (.severity | safe_line_string)));
            if
              (.status | valid_status) and
              (.bundle_id | safe_line_string) and
              (.completeness | type == "object") and
              (.completeness.percent | type == "number" and . >= 0 and . <= 100) and
              (.integrity | valid_integrity) and
              (.warning_count | type == "number" and . >= 0 and floor == .) and
              (.findings | valid_findings)
            then
              "conclusion=\(.status)",
              "bundle-id=\(.bundle_id)",
              "completeness=\(.completeness.percent)",
              "integrity=\(.integrity)",
              "critical-violations=" + ([.findings // [] | .[] | select(.severity == "critical")] | length | tostring),
              "warnings=\(.warning_count)"
            else
              error("invalid AgentProof evidence output schema")
            end
          ' .agentproof/evidence.json >> "$GITHUB_OUTPUT"
          output_code=$?
          if [ "$output_code" -eq 0 ]; then
            printf 'evidence-valid=true\n' >> "$GITHUB_OUTPUT"
            output_code=$?
          fi
        else
          printf 'conclusion=failed\n' >> "$GITHUB_OUTPUT"
          output_code=$?
        fi
        set -e
        if [ "$verify_code" -ne 0 ]; then
          exit "$verify_code"
        fi
        exit "$output_code"
    - name: Step Summary
      id: summary
      shell: bash
      if: always() && steps.verify.outputs.evidence-valid == 'true'
      run: |
        "${{ github.action_path }}/scripts/write-step-summary.sh"
    - name: Upload AgentProof reports
      if: always() && steps.verify.outputs.evidence-valid == 'true' && steps.summary.outcome == 'success' && hashFiles('.agentproof/report.md') != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: agentproof-report
        path: |
          .agentproof/manifest.json
          .agentproof/evidence.json
          .agentproof/attestation.json
          .agentproof/report.md
          .agentproof/report.html
        include-hidden-files: true
        if-no-files-found: error
