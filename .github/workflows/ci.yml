name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22.x"
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o bin/agentproof ./cmd/agentproof

  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22.x"
      # A test failure must reach AgentProof as failed evidence, not abort the job.
      - run: mkdir -p .agentproof/inputs && (go test -json ./... > .agentproof/inputs/go-test.jsonl || true)
      - uses: ./
        with:
          base: origin/${{ github.base_ref }}
          test-results: .agentproof/inputs/go-test.jsonl
          require-tests: "true"
          fail-on: critical
