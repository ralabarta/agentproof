name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.22.x"
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o bin/agentproof ./cmd/agentproof

  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.22.x"
      # A test failure must reach AgentProof as failed evidence, not abort the job.
      - run: mkdir -p .agentproof/inputs && (go test -json ./... > .agentproof/inputs/go-test.jsonl || true)
      - uses: ./
        with:
          base: origin/${{ github.base_ref }}
          test-results: .agentproof/inputs/go-test.jsonl
          require-tests: "true"
          fail-on: critical
